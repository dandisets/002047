dateCreated: '2026-11-03T15:28:28.212273+00:00'
description: 'We present a one-photon miniscope calcium-imaging dataset from dorsal
  hippocampal CA1 of mice (GCaMP6s, GRIN lens, UCLA Miniscope V4.4), comprising approximately
  27,700 unique neurons recorded in 201 sessions from 47 mice during open field free
  exploration and contextual fear learning. It covers three open-field paradigms —
  a standard open field, an open field with marked floor patterns and an open field
  enriched with objects, and a context pre-exposure facilitation effect (CPFE) task,
  with 12 to 25 mice in each. In the standard open field and the CPFE task, wild-type
  and 5xFAD mice received saline or the NMDA-receptor antagonist MK-801. All sessions
  were recorded with the same imaging system and processed with the same pipeline.
  Every session includes synchronized behavioral video, DeepLabCut pose estimates
  and annotated behavioral variables: spatial occupancy and locomotor state in all
  paradigms, and rearing, freezing and object interaction where applicable. The dataset
  holds each stage of processing in NWB format: raw miniscope movies, source-extraction
  parameters, spatial footprints and traces of retained and rejected components, curation
  decisions, detected calcium events, cross-session neuronal matches and INTENSE mutual-information
  selectivity results.'
