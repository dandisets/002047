description: 'We present a one-photon calcium-imaging dataset from dorsal hippocampal
  CA1, comprising approximately 27,700 neurons recorded in 201 sessions from 47 mice
  during free exploration and contextual fear learning. It covers four paradigms:
  an enriched open field, a marked open field, an open field, and a context pre-exposure
  facilitation effect task, with 12 to 25 mice in each. In the open field and the
  context pre-exposure task, wild-type and 5×FAD mice received saline or the NMDA
  receptor antagonist MK-801, and all four groups were recorded and processed with
  the same procedures. Every session carries synchronized behavioral video, pose estimates
  and annotated behavioral variables describing spatial occupancy, locomotor state,
  rearing, freezing and object interaction. The dataset holds each stage of processing:
  raw miniscope movies, source-extraction parameters, spatial footprints and traces
  of retained and rejected components, curation decisions, detected calcium events,
  cross-session neuronal matches and mutual-information behavioral selectivity results.'
